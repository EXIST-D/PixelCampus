  <div id="game"></div>
  <div id="hud">
    <div id="banner" class="box hidden"><div id="banner-title"></div><div id="banner-sub"></div></div>

    <div id="hint" class="box hidden"></div>
    <div id="controls">WASD / 方向键 移动 · Shift 奔跑 · E 互动 · I 背包 · J 成就 · Q 任务 · T 组队 · X 表情 · P 拍照 · Z 沉浸 · Enter 聊天 · C 学生证 · M 地图 · +/- 缩放</div>
    <div id="minimap" class="box"><div id="minimap-img"></div><div id="minimap-dot"></div><div id="minimap-n">北 ↑</div></div>
    <div id="dialog" class="box hidden">
      <div id="dialog-title"></div>
      <div id="dialog-body"></div>
      <div id="dialog-foot">按 E 或 Esc 关闭</div>
    </div>
    <div id="loading"><img id="loading-art" src="splash.webp" alt="" decoding="async" /><div id="loading-title">像素校园</div><div id="loading-bar"><div id="loading-fill"></div></div><div id="loading-text">加载中…</div><div id="loading-credit">© 2026 EXIST-D · github.com/EXIST-D</div></div>
